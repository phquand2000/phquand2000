<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Quan Phan — browser internals, distributed systems, agent tooling">
  <defs>
    <pattern id="plus" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M22 15v14M15 22h14" stroke="#8b949e" stroke-width="1" fill="none"/>
    </pattern>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.28" stop-color="#000"/>
      <stop offset="1"    stop-color="#fff"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="260" fill="url(#fadeG)"/></mask>
  </defs>

  <rect width="1200" height="260" fill="#0b0d10"/>
  <g mask="url(#fade)">
    <rect width="1200" height="260" fill="url(#plus)" opacity="0.8"/>
    <g fill="#e6edf3">
      <circle cx="662" cy="88"  r="2.4"><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="0s"   repeatCount="indefinite"/></circle>
      <circle cx="838" cy="176" r="2.4"><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="970" cy="66"  r="2.4"><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1102" cy="132" r="2.4"><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="750" cy="220" r="2.4"><animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="2.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <text x="64" y="132" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="56" font-weight="600" fill="#e6edf3" letter-spacing="1">Quan Phan</text>
  <text x="66" y="170" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#7d8590" letter-spacing="2.6">Browser internals · Distributed systems · Agent tooling</text>
</svg>
