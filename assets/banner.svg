<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="30%" style="stop-color:#161b22"/>
      <stop offset="70%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" rx="0"/>

  <line x1="80" y1="220" x2="1120" y2="220" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>

  <circle cx="100" cy="60" r="3" fill="#58a6ff" opacity="0.15"/>
  <circle cx="300" cy="40" r="2" fill="#bc8cff" opacity="0.1"/>
  <circle cx="500" cy="80" r="4" fill="#58a6ff" opacity="0.1"/>
  <circle cx="700" cy="30" r="2" fill="#bc8cff" opacity="0.15"/>
  <circle cx="900" cy="70" r="3" fill="#58a6ff" opacity="0.1"/>
  <circle cx="1100" cy="50" r="2" fill="#bc8cff" opacity="0.1"/>
  <circle cx="200" cy="260" r="2" fill="#58a6ff" opacity="0.1"/>
  <circle cx="600" cy="270" r="3" fill="#bc8cff" opacity="0.08"/>
  <circle cx="1000" cy="250" r="2" fill="#58a6ff" opacity="0.12"/>

  <text x="600" y="115" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">Quan Phan</text>

  <text x="600" y="160" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle" letter-spacing="3">FULL-STACK DEVELOPER</text>

  <text x="600" y="255" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#58a6ff" text-anchor="middle" opacity="0.7">TypeScript  ·  Python  ·  Go  ·  Rust  ·  C++</text>

  <rect x="80" y="185" width="1040" height="1" fill="url(#accent)" opacity="0.08"/>
</svg>
