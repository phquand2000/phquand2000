name: guestbook

on:
  issues:
    types: [opened]

# Serialise so two visitors signing at once cannot race the README write.
concurrency:
  group: guestbook
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sign:
    if: startsWith(github.event.issue.title, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      # Pinned: this job holds contents:write and runs on public input.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add entry
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/guestbook.mjs

      - name: Commit
        if: steps.entry.outputs.added == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && exit 0
          git commit -m "guestbook: entry from @${{ github.event.issue.user.login }}"
          # A queued run may have landed its own entry since checkout.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.entry.outputs.added }}" = "true" ]; then
            gh issue close "$NUMBER" --repo "$REPO" \
              --comment "Signed — thanks, it's on the profile now."
          else
            gh issue close "$NUMBER" --repo "$REPO" --reason "not planned" \
              --comment "I could not use anything from that body — it needs at least one letter or number after links and markup are stripped. Open a new issue titled \`guestbook\` to try again."
          fi
