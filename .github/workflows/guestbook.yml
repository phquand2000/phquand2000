name: guestbook

on:
  issues:
    types: [opened]

# Serialise so two visitors signing at once cannot race the README write.
concurrency:
  group: guestbook
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sign:
    if: startsWith(github.event.issue.title, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node .github/scripts/guestbook.mjs

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "guestbook: entry from @${{ github.event.issue.user.login }}"
          git push

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Signed — thanks, it's on the profile now." --repo ${{ github.repository }}
